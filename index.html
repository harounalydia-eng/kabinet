<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#F4F2EC" />
    <!-- Browser tab: the K alone on a transparent canvas, swapped with the resolved theme (src/lib/theme.tsx). -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="/brand/favicon-light.svg?v=3" />
    <script>
      // Resolve the theme before first paint (mirrors src/lib/theme.tsx).
      (function () {
        var p = null;
        try { p = localStorage.getItem('kabinet-inspo:theme'); } catch (e) {}
        if (p !== 'light' && p !== 'dark') p = 'system';
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
        var h = document.documentElement;
        h.setAttribute('data-theme', t);
        h.setAttribute('data-theme-preference', p);
        h.style.colorScheme = t;
        var f = document.getElementById('favicon');
        var want = t === 'dark' ? '/brand/favicon-dark.svg?v=3' : '/brand/favicon-light.svg?v=3';
        if (f && f.getAttribute('href') !== want) { var n = f.cloneNode(); n.setAttribute('href', want); f.replaceWith(n); }
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#161513' : '#F4F2EC');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <!-- Home-screen icon: iOS masks and fills icons, so this one keeps its intentional background. Never used as the tab icon. -->
    <link rel="apple-touch-icon" href="/brand/kabinet-icon.png" />
    <title>KABINET</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
